[project]
name = "speaker"
dynamic = ["version"]
description = "Lee en voz alta las respuestas de asistentes de IA de terminal y permite dictarles por voz"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "piper-tts>=1.3",
    "faster-whisper>=1.1",
    "lingua-language-detector>=2.0",
]

[project.scripts]
speaker = "speaker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/speaker/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/speaker"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
